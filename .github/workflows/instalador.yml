name: Instalador de Windows

# Arma MotionAI-<versión>-instalador.exe en una máquina Windows, con ffmpeg y whisper.cpp (modelo base) adentro.
# Se descarga desde la pestaña Actions → la corrida → Artifacts.
on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/instalador.yml'

env:
  WHISPER_VERSION: v1.9.5
  # Carpeta donde empaquetar.ts arma la app (fuera del repositorio).
  MOTIONAI_PAQUETE: ${{ github.workspace }}/../motionai-paquete

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # whisper.cpp: se compila aquí (binario estático, sin DLLs) y se guarda en caché por versión.
      - name: Caché de whisper.cpp
        id: cache-whisper
        uses: actions/cache@v4
        with:
          path: herramientas-ext/whisper
          key: whisper-${{ env.WHISPER_VERSION }}-base-win64
      - name: Compilar whisper.cpp y bajar el modelo base
        if: steps.cache-whisper.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch "$WHISPER_VERSION" https://github.com/ggml-org/whisper.cpp herramientas-ext/whisper.cpp
          cmake -S herramientas-ext/whisper.cpp -B herramientas-ext/whisper.cpp/build -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DWHISPER_BUILD_TESTS=OFF
          cmake --build herramientas-ext/whisper.cpp/build --config Release --target whisper-cli -j 4
          mkdir -p herramientas-ext/whisper
          cp herramientas-ext/whisper.cpp/build/bin/Release/whisper-cli.exe herramientas-ext/whisper/
          curl -sSL -o herramientas-ext/whisper/ggml-base.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          ls -la herramientas-ext/whisper

      # ffmpeg (compilación GPL de BtbN, con libx264 y libx265).
      - name: Bajar ffmpeg
        shell: bash
        run: |
          curl -sSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q ffmpeg.zip -d herramientas-ext
          mv herramientas-ext/ffmpeg-master-latest-win64-gpl herramientas-ext/ffmpeg
          herramientas-ext/ffmpeg/bin/ffmpeg.exe -hide_banner -encoders | grep -E "libx264|libx265"

      - name: Armar el instalador
        shell: bash
        env:
          MOTIONAI_FFMPEG_DIR: ${{ github.workspace }}\herramientas-ext\ffmpeg\bin
          MOTIONAI_WHISPER: ${{ github.workspace }}\herramientas-ext\whisper\whisper-cli.exe
          MOTIONAI_WHISPER_MODELO: ${{ github.workspace }}\herramientas-ext\whisper\ggml-base.bin
        run: pnpm --filter @motionai/app empaquetar

      # Prueba rápida: la app instalada transcribe con su whisper y codifica con su ffmpeg.
      - name: Probar los binarios incluidos
        shell: bash
        run: |
          R="$MOTIONAI_PAQUETE/dist/recursos"
          "$R/ffmpeg/ffmpeg.exe" -hide_banner -f lavfi -i sine=d=1 -y prueba.wav
          "$R/whisper/whisper-cli.exe" -m "$R/whisper/ggml-base.bin" -f prueba.wav -np -nt
          ls -la packages/app/instalador

      - uses: actions/upload-artifact@v4
        with:
          name: MotionAI-instalador-windows
          path: packages/app/instalador/*.exe
          if-no-files-found: error
          retention-days: 30
